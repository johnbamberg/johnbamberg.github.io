<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ page.title | default: "AustMS 2026" }}</title>
<!--
  Minimal stand-alone layout for the AustMS 2026 pages (no menus from the rest of the website).
  Use it from a Markdown file by starting the file with:
    ---
    layout: austms
    title: AustMS 2026 Announcements
    ---
-->
<script>
  window.MathJax = { tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], processEscapes: true } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<style>
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #ffffff; color: #1d1a1c;
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.page {
  max-width: 42rem; margin: 0 auto;
  padding: 2.5rem max(20px, env(safe-area-inset-right, 0px)) 4rem max(20px, env(safe-area-inset-left, 0px));
}
nav { font-size: .95rem; margin-bottom: 1.75rem; }
a { color: #7b2d3b; }
h1 { font-size: 1.9rem; line-height: 1.2; font-weight: 600; margin: 0 0 1.5rem; }
h2 { font-size: 1.2rem; font-weight: 600; margin: 2.25rem 0 .4rem; }
h3 { font-size: 1.05rem; margin: 1.5rem 0 .4rem; }
p, ul, ol { margin: 0 0 1rem; }
li { margin-bottom: .25rem; }
img { max-width: 100%; height: auto; }
blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid #e4dcda; color: #4a4245; }
code { font-size: .9em; }
hr { border: 0; border-top: 1px solid #e4dcda; margin: 2rem 0; }
table { border-collapse: collapse; margin: 0 0 1rem; display: block; overflow-x: auto; }
th, td { padding: .4rem .8rem .4rem 0; border-bottom: 1px solid #e4dcda; text-align: left; vertical-align: top; }
:focus-visible { outline: 2px solid #7b2d3b; outline-offset: 2px; }
</style>
</head>
<body>
<div class="page">
  <nav><a href="index.html">← Programme</a></nav>
  <h1>{{ page.title | default: "AustMS 2026" }}</h1>
  <main>
{{ content }}
  </main>
</div>
</body>
</html>
