<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AustMS 2026 Programme</title>
<meta name="description" content="Programme for the 70th Annual Meeting of the Australian Mathematical Society, The University of Western Australia, 1–4 December 2026.">

<!-- Renders LaTeX ($...$, \(...\), $$...$$, \begin{align}...) in titles and abstracts. -->
<script>
  window.MathJax = {
    tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], processEscapes: true },
    options: { ignoreHtmlClass: "no-math" }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>

<style>
/* Layout: one centred column. Header + tab bar, then tables of talks grouped by day.
   On phones each table row becomes a stacked card. Change the colours here. */
:root {
  --bg: #ffffff;
  --fg: #1d1a1c;
  --muted: #675d60;
  --line: #e4dcda;
  --head: #ead6d1;      /* table header band */
  --accent: #7b2d3b;    /* tabs, buttons, tick boxes */
  --accent-fg: #ffffff;
  --picked: #fbf0e4;    /* background of a ticked talk */
  --warn: #9a3f12;
  --warn-bg: #fdeee3;
  --ok: #2f6b3a;
  --chip: #f5efed;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151a; --fg: #ece6e5; --muted: #a99ea1; --line: #3a3337; --head: #47313a;
    --accent: #e7a6b1; --accent-fg: #1b1016; --picked: #302720; --warn: #f2a878; --warn-bg: #3a2519;
    --ok: #8fd19e; --chip: #28232a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151a; --fg: #ece6e5; --muted: #a99ea1; --line: #3a3337; --head: #47313a;
  --accent: #e7a6b1; --accent-fg: #1b1016; --picked: #302720; --warn: #f2a878; --warn-bg: #3a2519;
  --ok: #8fd19e; --chip: #28232a; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
.wrap {
  max-width: 76rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { padding-block: 1.75rem 0.5rem; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.8vw, 2.4rem); line-height: 1.15; margin: 0 0 .35rem; font-weight: 600; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); }
.notice { margin: .9rem 0 0; padding: .55rem .8rem; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: .9rem; }

/* Tab bar + search */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; padding-block: .6rem; }
.tabs { display: flex; flex-wrap: wrap; gap: .35rem; }
.tab {
  font: inherit; font-size: .95rem; cursor: pointer;
  padding: .4rem .85rem; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--fg);
}
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tab .count { display: inline-block; min-width: 1.4em; padding: 0 .35em; margin-left: .25rem; border-radius: 999px; background: var(--chip); color: var(--fg); font-size: .8rem; text-align: center; font-variant-numeric: tabular-nums; }
.tab[aria-current="page"] .count { background: var(--accent-fg); color: var(--accent); }
.search { flex: 1 1 14rem; max-width: 22rem; }
.search input {
  width: 100%; font: inherit; font-size: .95rem; padding: .4rem .75rem;
  border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 1.25rem 3rem; min-height: 50vh; }
h2 { font-size: clamp(1.2rem, 1.05rem + .7vw, 1.55rem); font-weight: 500; margin: 2rem 0 .75rem; text-wrap: balance; }
h2:first-child { margin-top: .5rem; }
h3 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
.lead { display: block; margin: 0 0 .6rem; }
select {
  font: inherit; width: 100%; max-width: 36rem; padding: .5rem .7rem;
  border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--fg);
}

/* Session overview chips */
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: .5rem; margin-top: 1.25rem; }
.chip {
  font: inherit; text-align: left; cursor: pointer; padding: .6rem .8rem; border-radius: 8px;
  border: 1px solid var(--line); background: var(--chip); color: var(--fg);
  display: flex; justify-content: space-between; gap: .75rem; align-items: baseline;
}
.chip:hover { border-color: var(--accent); }
.chip small { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.days { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
.days .tab { font-variant-numeric: tabular-nums; }

/* Talk tables */
.table-wrap { overflow-x: auto; }
table.talks { width: 100%; border-collapse: collapse; font-size: .97rem; }
.talks thead th { background: var(--head); text-align: left; font-weight: 600; padding: .6rem .7rem; white-space: nowrap; }
.talks td { padding: .6rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.talks tr.slot-row th {
  text-align: left; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums;
  padding: 1.1rem .7rem .4rem; border-bottom: 2px solid var(--head);
}
.talks .c-pick { width: 2.75rem; padding-right: 0; }
.talks .c-time { width: 7.5rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.talks .c-session { width: 13rem; }
.talks td.c-session { color: var(--muted); }
.talks .c-speaker { width: 15rem; }
.talks .c-room { width: 8rem; text-align: right; white-space: nowrap; }
.aff { display: block; color: var(--muted); font-size: .85rem; }
.tba { color: var(--muted); font-style: italic; }
.badge { display: inline-block; margin-left: .35rem; padding: 0 .45rem; border-radius: 999px; font-size: .75rem; font-weight: 600; letter-spacing: .02em; vertical-align: .1em; background: var(--head); color: var(--fg); }
tr.is-picked td { background: var(--picked); }
tr.is-removed td { opacity: .45; }
tr.is-clash td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.clash { margin-top: .3rem; color: var(--warn); font-size: .87rem; }
.pick { display: flex; align-items: center; justify-content: center; width: 2rem; height: 1.6rem; cursor: pointer; }
.pick input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); cursor: pointer; margin: 0; }
details summary { cursor: pointer; }
details summary::marker { color: var(--muted); }
.abstract { margin: .45rem 0 .2rem; color: var(--muted); font-size: .92rem; max-width: 70ch; overflow-x: auto; }
.abstract p { margin: 0 0 .55rem; }
.abstract .authors { color: var(--fg); }
.abstract a { color: var(--accent); overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* My programme */
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin: .25rem 0 1rem; }
.btn {
  font: inherit; font-size: .95rem; cursor: pointer; padding: .45rem .9rem; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--warn); color: var(--warn); background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hint { color: var(--muted); font-size: .92rem; max-width: 65ch; }
.empty { padding: 1.5rem 0; color: var(--muted); max-width: 60ch; }
.banner { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; padding: .7rem .9rem; margin-bottom: 1rem; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); }
.banner p { margin: 0; flex: 1 1 18rem; }
.share-out { display: flex; gap: .5rem; margin: .5rem 0 1rem; flex-wrap: wrap; }
.share-out input { flex: 1 1 18rem; min-width: 0; font: inherit; font-size: .85rem; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); color: var(--fg); }
.status { color: var(--muted); font-size: .9rem; min-height: 1.4em; }
.error { padding: 1rem; border-radius: 8px; background: var(--warn-bg); color: var(--warn); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
footer .wrap { padding-block: 1.25rem 2rem; }
footer a, main a { color: var(--accent); }

/* Organiser check */
.stats { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 1rem; padding: 0; list-style: none; }
.stats li { padding: .5rem .8rem; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.stats strong { font-size: 1.15rem; margin-right: .3rem; }
.problems { padding-left: 1.2rem; max-width: 75ch; }
.problems li { margin-bottom: .35rem; }
.problems .kind { font-weight: 600; color: var(--warn); }
.problems .info { font-weight: 600; color: var(--muted); }
.all-good { color: var(--ok); font-weight: 600; }
table.grid { border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: .4rem .65rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.grid th:first-child, table.grid td:first-child, table.grid th:nth-child(2), table.grid td:nth-child(2) { text-align: left; }
table.grid thead th { background: var(--head); }
.file-pick { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; padding: .8rem 1rem; border: 1px dashed var(--line); border-radius: 8px; margin: 1rem 0; }

/* Phones: rows become stacked cards */
@media screen and (max-width: 720px) {
  .talks thead { display: none; }
  .talks, .talks tbody { display: block; }
  .talks tr.talk {
    display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto;
    grid-template-areas: "pick time room" "pick session session" "pick speaker speaker" "pick title title";
    column-gap: .4rem; padding: .7rem 0; border-bottom: 1px solid var(--line);
  }
  .talks td { display: block; padding: 0; border: 0; width: auto !important; background: transparent !important; }
  .talks tr.slot-row, .talks tr.slot-row th { display: block; }
  .talks tr.slot-row th { padding: 1.1rem 0 .35rem; }
  tr.is-picked { background: var(--picked); }
  tr.is-clash { box-shadow: inset 3px 0 0 var(--warn); }
  tr.is-clash td:first-child { box-shadow: none; }
  .talks .c-pick { grid-area: pick; }
  .talks .c-time { grid-area: time; font-weight: 600; }
  .talks .c-room { grid-area: room; text-align: right; color: var(--muted); }
  .talks .c-session { grid-area: session; font-size: .87rem; }
  .talks .c-speaker { grid-area: speaker; font-weight: 600; margin-top: .1rem; }
  .talks .c-speaker .aff { font-weight: 400; }
  .talks .c-title { grid-area: title; margin-top: .15rem; }
  .search { max-width: none; }
  .bar { position: static; }        /* keep the whole phone screen for the programme */
  .tab { padding: .35rem .75rem; font-size: .92rem; }
}

/* Printing (My programme → Print / save as PDF) */
@media print {
  .bar, .toolbar, .hint, .banner, .share-out, .status, .no-print, footer, .notice { display: none !important; }
  .talks .c-pick { display: none; }
  body { font-size: 11pt; background: #fff; color: #000; }
  tr { break-inside: avoid; }
  h2 { break-after: avoid; margin: 1rem 0 .4rem; }
  .abstract { display: none; }
  tr.is-picked td { background: none; }
  .table-wrap { overflow: visible; }
  table.talks { table-layout: fixed; font-size: 10pt; }
  .talks td, .talks thead th { padding: .35rem .45rem; }
  .talks .c-time { width: 6.2rem; } .talks .c-session { width: 8.5rem; } .talks .c-speaker { width: 9.5rem; }
  .talks .c-room { width: 6rem; white-space: normal; }
  details summary { list-style: none; }
  details summary::-webkit-details-marker { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top wrap">
  <h1 id="conf-title">AustMS 2026 Programme</h1>
  <p class="sub" id="conf-sub"></p>
  <p class="notice" id="notice" hidden></p>
</header>

<nav class="bar no-print" aria-label="Programme views">
  <div class="wrap">
    <div class="tabs">
      <button class="tab" type="button" data-view="session">By session</button>
      <button class="tab" type="button" data-view="day">By day</button>
      <button class="tab" type="button" data-view="mine">My programme <span class="count" id="pick-count">0</span></button>
    </div>
    <div class="search">
      <label class="sr" for="search">Search speakers, authors and titles</label>
      <input id="search" type="search" placeholder="Search speaker, title or room" autocomplete="off">
    </div>
  </div>
</nav>

<main class="wrap" id="main" aria-live="polite">
  <p>Loading the programme…</p>
</main>

<footer>
  <div class="wrap">
    <div>Tick the box next to a talk to add it to <strong>My programme</strong>. Your choices are saved in this browser on this device.</div>
    <div id="site-link"></div>
  </div>
</footer>

<script>
/* =====================================================================
   SETTINGS — this is the only part you normally need to edit.
   ===================================================================== */
const CONFIG = {
  // The programme data: the JSON export from the registration system (or the
  // public-only copy made on the check page, …/#check). A CSV file also works.
  dataUrl: "programme.json",

  title: "AustMS 2026 Programme",
  subtitle: "70th Annual Meeting of the Australian Mathematical Society · The University of Western Australia · 1–4 December 2026",
  siteUrl: "https://austms2026.org.au/",

  // Shown in an orange box under the title. Set to "" to hide it.
  notice: "Provisional programme. Times and rooms will appear as each session is timetabled.",

  // Only talks with one of these values in the export's "accepted" field are shown.
  // Use [] to show every talk.
  showStatuses: ["Accepted"],

  // Conference days. A timetable value such as "Wednesday 13:30:00" is placed on the matching date.
  conferenceDates: ["2026-12-01", "2026-12-02", "2026-12-03", "2026-12-04"],
  utcOffset: "+08:00",          // Perth time (no daylight saving). Used for calendar files.

  // Talk lengths in minutes, used to work out end times.
  defaultMinutes: 30,           // a normal talk
  keynoteMinutes: 60,           // talks with keynote = 1

  // Session codes used in the export → the name shown on the page, the room, and (optionally) the talk length.
  // The menu lists sessions in this order. Fill in rooms when they are known.
  sessions: [
    { code: "Plen",      name: "Plenary lectures",                              room: "", minutes: 60 },
    { code: "Public",    name: "Public lecture",                                room: "", minutes: 60 },
    { code: "Ed Aft",    name: "Education Afternoon",                           room: "" },
    { code: "Al Comb",   name: "Algebra and Combinatorics",                     room: "" },
    { code: "App Ind",   name: "Applied and industrial mathematics",            room: "" },
    { code: "Categ",     name: "Category Theory, Homotopy Theory, and K-Theory", room: "" },
    { code: "Comp Math", name: "Computational Mathematics",                     room: "" },
    { code: "CED",       name: "Cryptography, elliptic curves and dynamics",    room: "" },
    { code: "Geom Sym",  name: "Differential Geometry and Symmetry",            room: "" },
    { code: "EDI",       name: "Equity, Diversity and Inclusion",               room: "" },
    { code: "Dyn Erg",   name: "Ergodic Theory and Dynamical Systems",          room: "" },
    { code: "Fun Anal",  name: "Functional Analysis",                           room: "" },
    { code: "Geom Anal", name: "Geometric Analysis",                            room: "" },
    { code: "Harm An",   name: "Harmonic Analysis and Hamiltonian PDE",         room: "" },
    { code: "Math Phys", name: "Mathematical Physics",                          room: "" },
    { code: "Math Edu",  name: "Mathematics Education",                         room: "" },
    { code: "Outreach",  name: "Mathematics outreach and engagement",           room: "" },
    { code: "NL PDE",    name: "Nonlinear PDEs and their applications",         room: "" },
    { code: "Num Th",    name: "Number theory",                                 room: "" },
    { code: "Opt",       name: "Optimisation",                                  room: "" },
    { code: "Prob Stat", name: "Probability and Mathematical Statistics",       room: "" },
    { code: "Rep",       name: "Representation Theory",                         room: "" },
    { code: "SDE",       name: "Stochastic differential equations",             room: "" },
    { code: "Top",       name: "Topology",                                      room: "" }
  ],

  storageKey: "austms2026-my-programme",
  calendarFileName: "AustMS2026-my-programme.ics",
  calendarName: "AustMS 2026 – my programme",
  uidDomain: "austms2026.org.au"
};

/* =====================================================================
   Everything below is the viewer itself.
   ===================================================================== */
const $ = (sel, el = document) => el.querySelector(sel);
const main = $("#main");
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

let DATA = null;            // the programme being shown (see analyse())
let TALKS = [];             // talks shown on the page: scheduled first (by time), then unscheduled
let BY_ID = new Map();
let SESSIONS = [];          // session names in menu order
let DATES = [];
let PUBLISHED = null;       // the analysed published file
let CHECK = null;           // the file shown on the check page
let previewName = "";
let picks = new Set();
const state = { view: "session", session: "", day: "", query: "" };

/* ---------- small helpers ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fold(s) { return String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
function pad(n) { return String(n).padStart(2, "0"); }
function fmtTime(min) { return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`; }
function dateParts(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; }
function dayLong(iso) { const p = dateParts(iso); return `${WEEKDAYS[p.wd]} ${p.d} ${MONTHS[p.m - 1]}`; }
function dayShort(iso) { const p = dateParts(iso); return `${WEEKDAYS[p.wd].slice(0, 3)} ${p.d} ${MONTHS[p.m - 1].slice(0, 3)}`; }
function isoOf(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
function validDate(y, m, d) { const t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() === +y && t.getUTCMonth() === m - 1 && t.getUTCDate() === +d; }
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
function shortHash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const HONORIFICS = /^(?:(?:emeritus|emerita|adjunct|assoc|associate|asst|assistant|a\/prof|prof|professor|dr|mr|mrs|ms|miss|mx|sir|dame)\.?\s+)+/i;
function bareName(name) { return String(name || "").replace(HONORIFICS, "").trim(); }
function surname(name) { const w = bareName(name).split(/\s+/); return w[w.length - 1] || ""; }

/* ---------- reading the data file ---------- */
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const [head, ...body] = rows.filter(r => r.some(f => f.trim() !== ""));
  return body.map(r => Object.fromEntries((head || []).map((h, i) => [h, r[i] ?? ""])));
}
/* Returns an array of talk records from JSON ({"talks": [...]} or [...]) or CSV text. */
function parseData(text) {
  text = text.replace(/^\uFEFF/, "");
  const t = text.trim();
  if (/^<(!doctype|html)/i.test(t)) throw new Error("The link returned a web page, not a JSON or CSV file.");
  if (t.startsWith("{") || t.startsWith("[")) {
    let j;
    try { j = JSON.parse(t); } catch (e) { throw new Error("The JSON file couldn't be read: " + e.message); }
    const list = Array.isArray(j) ? j : (j.talks || j.programme || j.program || j.data || Object.values(j).find(Array.isArray));
    if (!Array.isArray(list)) throw new Error("The JSON file has no list of talks (expected {\"talks\": [ … ]}).");
    return list.filter(r => r && typeof r === "object");
  }
  return parseCSV(text);
}

/* Field names accepted in the data (capitals, spaces and punctuation are ignored). */
const FIELD_NAMES = {
  id: ["id", "talkid", "ref"],
  session: ["session", "sessioncode", "specialsession", "stream", "track"],
  speaker: ["speaker", "presenter", "name", "speakers"],
  authors: ["authors", "author", "coauthors"],
  affiliation: ["affiliation", "institution", "university", "organisation", "organization"],
  title: ["title", "talktitle", "talk"],
  abstract: ["abstract", "summary", "description"],
  room: ["room", "venue", "location"],
  keynote: ["keynote", "invited"],
  status: ["accepted", "status", "decision"],
  slot: ["timetabled", "timeslot", "slot", "scheduled", "when"],
  date: ["date", "day"],
  start: ["start", "starttime", "from", "time", "begin"],
  end: ["end", "endtime", "to", "finish", "until"],
  minutes: ["minutes", "duration", "length"],
  days: ["days", "availability", "available"]
};
function normalise(rec) {
  const byKey = {};

/* ---------- turning records into talks ---------- */

    const r = normalise(rec);
    const code = r.session || "(no session)";
    const info = sessionInfo(code);
    if (!(showAll || !r.status || CONFIG.showStatuses.some(s => fold(s) === fold(r.status)))) { hidden.push({ code, status: r.status, r }); return; }

function applyData(a) {
  DATA = a;

  const names = [...new Set(TALKS.map(t => t.session))];
  const known = CONFIG.sessions.map(s => s.name).filter(n => names.includes(n));
  SESSIONS = known.concat(names.filter(n => !known.includes(n)).sort((x, y) => x.localeCompare(y)));

  for (const [code, n] of unknown) add("Unknown session code", `“${code}” (${plural(n, "talk")}) isn't in the sessions list in the settings, so it is shown under its code.`);
  for (const t of a.talks) {

    if (t.scheduled && !CONFIG.conferenceDates.includes(t.date)) add("Outside the conference", `${t.speaker} (${t.session}) is scheduled on ${dayLong(t.date)}.`);
    if (t.scheduled && t.days) {

  return `<tr class="talk${on ? " is-picked" : ""}${clash ? " is-clash" : ""}" data-id="${esc(t.id)}">
    <td class="c-pick"><label class="pick"><input type="checkbox" data-id="${esc(t.id)}"${on ? " checked" : ""}><span class="sr">${esc(label)}</span></label></td>
    ${opts.time ? `<td class="c-time">${t.scheduled ? `${fmtTime(t.start)}–${fmtTime(t.end)}` : `<span class="tba">Time TBA</span>`}</td>` : ""}
    ${opts.session ? `<td class="c-session">${esc(t.session)}</td>` : ""}
    <td class="c-speaker">${esc(t.speaker)}${t.affiliation ? `<span class="aff">${esc(t.affiliation)}</span>` : ""}</td>
    <td class="c-title">${title}${clash ? `<div class="clash">Overlaps with ${clash.map(c => esc(c.speaker) + " (" + esc(c.session) + ")").join(", ")}</div>` : ""}</td>
    ${opts.room ? `<td class="c-room">${esc(t.room)}</td>` : ""}
  </tr>`;
}
function talkTable(talks, opts = {}) {
  opts = { time: true, ...opts, room: talks.some(t => t.room) };
  const cols = 3 + !!opts.time + !!opts.session + !!opts.room;
  let body = "", last = null;
  for (const t of talks) {
    if (opts.slots && t.start !== last) { body += `<tr class="slot-row"><th colspan="${cols}" scope="colgroup">${fmtTime(t.start)}</th></tr>`; last = t.start; }
    body += talkRow(t, opts);
  }
  return `<div class="table-wrap"><table class="talks"><thead><tr>
    <th class="c-pick"><span class="sr">Pick</span>✓</th>${opts.time ? `<th class="c-time">Time</th>` : ""}
    ${opts.session ? `<th class="c-session">Session</th>` : ""}
    <th class="c-speaker">Speaker</th><th class="c-title">Title</th>${opts.room ? `<th class="c-room">Room</th>` : ""}
  </tr></thead><tbody>${body}</tbody></table></div>`;
}
function groupBy(arr, key) { const m = new Map(); for (const x of arr) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

function renderSession() {
  const options = SESSIONS.map(s => `<option value="${esc(s)}"${s === state.session ? " selected" : ""}>${esc(s)}</option>`).join("");
  let html = `<label class="lead" for="session-select">Choose a session to see its talks, day by day.</label>
    <select id="session-select"><option value="">— Select a session —</option>${options}</select>`;
  if (!state.session || !SESSIONS.includes(state.session)) {
    return html + `<div class="chips">${SESSIONS.map(s => {
      const n = TALKS.filter(t => t.session === s).length;
      return `<button type="button" class="chip" data-session="${esc(s)}"><span>${esc(s)}</span><small>${plural(n, "talk")}</small></button>`;
    }).join("")}</div>`;
  }
  const all = TALKS.filter(t => t.session === state.session);
  const sched = all.filter(t => t.scheduled), later = all.filter(t => !t.scheduled);
  for (const [date, talks] of groupBy(sched, t => t.date)) html += `<h2>${esc(state.session)} — ${dayLong(date)}</h2>${talkTable(talks)}`;
  if (later.length) {
    html += sched.length
      ? `<h2>${esc(state.session)} — not yet scheduled</h2><p class="hint">These talks don't have a time yet.</p>`
      : `<h2>${esc(state.session)}</h2><p class="hint">${plural(later.length, "talk")}. Times and rooms will appear here once this session is timetabled. You can already tick the talks you want to hear.</p>`;
    html += talkTable(later, { time: false });
  }
  return html;
}

function renderDay() {
  if (!DATES.includes(state.day)) state.day = defaultDay();
  const later = TALKS.filter(t => !t.scheduled).length;
  let html = `<div class="days" role="group" aria-label="Conference day">${DATES.map(d =>
    `<button type="button" class="tab" data-day="${d}"${d === state.day ? ' aria-current="page"' : ""}>${dayShort(d)}</button>`).join("")}</div>`;
  html += `<h2>${dayLong(state.day)}</h2>`;
  if (later) html += `<p class="hint">${plural(later, "talk")} ${later === 1 ? "doesn't" : "don't"} have a time yet. You'll find them under <a href="#" data-goto="session">By session</a>.</p>`;
  const talks = TALKS.filter(t => t.scheduled && t.date === state.day);
  if (!talks.length) return html + `<p class="empty">${TALKS.some(t => t.scheduled) ? "Nothing is scheduled on this day yet." : "The timetable hasn't been published yet."}</p>`;
  return html + talkTable(talks, { session: true, slots: true });
}

function findClashes(talks) {
  const clashes = new Map();
  for (let i = 0; i < talks.length; i++) for (let j = i + 1; j < talks.length; j++) {
    const a = talks[i], b = talks[j];
    if (!overlaps(a, b)) continue;
    if (!clashes.has(a.id)) clashes.set(a.id, []);
    if (!clashes.has(b.id)) clashes.set(b.id, []);
    clashes.get(a.id).push(b); clashes.get(b.id).push(a);
  }
  return clashes;
}

let incoming = null;
function renderMine() {
  let html = "";
  if (incoming) {
    const fresh = incoming.filter(id => !picks.has(id)).length;
    html += `<div class="banner" role="status"><p>This link contains <strong>${incoming.length}</strong> talk${incoming.length === 1 ? "" : "s"}${picks.size ? ` (${fresh} not yet in your programme)` : ""}.</p>
      <button type="button" class="btn" data-act="incoming-add">Add them to my programme</button>
      ${picks.size ? `<button type="button" class="btn ghost" data-act="incoming-replace">Replace my programme</button>` : ""}
      <button type="button" class="btn ghost" data-act="incoming-ignore">Ignore</button></div>`;
  }
  const talks = pickedTalks();
  const lost = [...picks].filter(id => !BY_ID.has(id)).length;
  if (!talks.length) {
    return html + `<h2>My programme</h2><p class="empty">You haven't picked any talks yet. Tick the box next to a talk in <a href="#" data-goto="session">By session</a> or <a href="#" data-goto="day">By day</a> and it will appear here, sorted by day and time.</p>`;
  }
  const sched = talks.filter(t => t.scheduled), later = talks.filter(t => !t.scheduled);
  const clashes = findClashes(sched);
  html += `<h2>My programme</h2>
    <div class="toolbar">
      <button type="button" class="btn" data-act="ics"${sched.length ? "" : " disabled"}>Add to calendar (.ics)</button>
      <button type="button" class="btn ghost" data-act="print">Print / save as PDF</button>
      <button type="button" class="btn ghost" data-act="share">Copy link to this programme</button>
      <button type="button" class="btn danger" data-act="clear">Clear all</button>
    </div>
    <div class="share-out" id="share-out" hidden><label class="sr" for="share-url">Link to your programme</label><input id="share-url" readonly></div>
    <div class="status" id="status"></div>
    <p class="hint">${plural(talks.length, "talk")} picked${later.length ? ` · ${later.length} not yet scheduled` : ""}${clashes.size ? ` · <strong>${clashes.size}</strong> overlap with another pick` : ""}.
      Your picks are saved in this browser only. To see them on your phone, use <em>Copy link</em> and open the link there${sched.length ? ", or add them to your calendar" : ""}.</p>
    ${lost ? `<p class="hint">${lost} talk${lost === 1 ? " you picked is" : "s you picked are"} no longer in the programme.</p>` : ""}`;
  for (const [date, group] of groupBy(sched, t => t.date)) html += `<h2>${dayLong(date)}</h2>${talkTable(group, { session: true, clashes })}`;
  if (later.length) {
    html += `<h2>Not yet scheduled</h2><p class="hint">These talks will move into place here once they have a time.${sched.length ? " The calendar file only includes talks that have a time, so download it again after the timetable is complete." : ""}</p>`;
    html += talkTable(later, { session: true, time: false });
  }
  return html;
}

function renderSearch() {
  const terms = fold(state.query).split(/\s+/).filter(Boolean);
  const hits = TALKS.filter(t => terms.every(w => t.search.includes(w)));
  let html = `<h2>${plural(hits.length, "talk")} matching “${esc(state.query.trim())}”</h2>`;
  if (!hits.length) return html + `<p class="empty">Try a surname, a word from a title, or a room.</p>`;
  for (const [date, group] of groupBy(hits.filter(t => t.scheduled), t => t.date)) html += `<h2>${dayLong(date)}</h2>${talkTable(group, { session: true })}`;
  const later = hits.filter(t => !t.scheduled);
  if (later.length) html += `<h2>Not yet scheduled</h2>${talkTable(later, { session: true, time: false })}`;
  return html;
}

function renderCheck() {
  const a = CHECK || PUBLISHED;
  if (!a) return `<p>Loading…</p>`;
  const probs = findProblems(a);
  const real = probs.filter(p => !p.info), info = probs.filter(p => p.info);
  const sched = a.talks.filter(t => t.scheduled).length;
  const hasDays = a.talks.some(t => t.days);
  const rank = name => { const i = CONFIG.sessions.findIndex(s => s.name === name); return i < 0 ? 1000 : i; };
  const rows = [...groupBy(a.talks, t => t.session)].sort((x, y) => rank(x[0]) - rank(y[0]) || x[0].localeCompare(y[0])).map(([name, ts]) => {
    const s = ts.filter(t => t.scheduled).length;
    const hid = a.hidden.filter(h => (sessionInfo(h.code) || { name: h.code }).name === name).length;
    return `<tr><td>${esc(name)}</td><td>${esc(ts[0].code)}</td><td>${ts.length}</td><td>${s}</td><td>${ts.length - s}</td><td>${hid || ""}</td></tr>`;
  }).join("");
  const hiddenOnly = [...groupBy(a.hidden, h => h.code)].filter(([code]) => !a.talks.some(t => t.code === code))
    .map(([code, hs]) => `<tr><td>${esc((sessionInfo(code) || { name: code }).name)}</td><td>${esc(code)}</td><td>0</td><td></td><td></td><td>${hs.length}</td></tr>`).join("");
  const statuses = [...new Set(a.hidden.map(h => h.status || "blank"))].join(", ");
  return `<h2>Programme check</h2>
    <p class="hint">For organisers. This page checks the programme data for timetable problems. Nothing here is saved or published.</p>
    <div class="file-pick">
      <label for="check-file">Check a new export from your computer:</label>
      <input type="file" id="check-file" accept=".json,.csv,application/json,text/csv">
    </div>
    <p>Checking <strong>${esc(a.name)}</strong>${CHECK ? " from your computer" : ", the file the website is using now"}.</p>
    <ul class="stats">
      <li><strong>${a.talks.length}</strong>shown on the website</li>
      <li><strong>${a.hidden.length}</strong>hidden${a.hidden.length ? ` (status: ${esc(statuses)})` : ""}</li>
      <li><strong>${sched}</strong>with a time</li>
      <li><strong>${a.talks.length - sched}</strong>without a time</li>
    </ul>
    <h3>Problems</h3>
    ${real.length ? `<ul class="problems">${real.map(p => `<li><span class="kind">${esc(p.kind)}:</span> ${esc(p.text)}</li>`).join("")}</ul>` : `<p class="all-good">No timetable problems found.</p>`}
    ${info.length ? `<ul class="problems">${info.map(p => `<li><span class="info">${esc(p.kind)}:</span> ${esc(p.text)}</li>`).join("")}</ul>` : ""}
    ${hasDays ? "" : `<p class="hint">Speaker availability can't be checked with this file. Choose the full export from the registration system above to include that check.</p>`}
    <h3>Sessions</h3>
    <div class="table-wrap"><table class="grid"><thead><tr><th>Session</th><th>Code</th><th>Shown</th><th>With a time</th><th>Without a time</th><th>Hidden</th></tr></thead>
      <tbody>${rows}${hiddenOnly}</tbody></table></div>
    <h3>Publish</h3>
    <p class="hint">The website file should contain only what the programme shows. This copy keeps the shown talks with their speaker, authors, title, abstract, session, keynote flag and time. It leaves out student status, availability and talks that aren't accepted.</p>
    <div class="toolbar">
      <button type="button" class="btn" data-act="tidy">Download programme.json for the website</button>
      ${CHECK ? `<button type="button" class="btn ghost" data-act="preview">Preview the website with this file</button>` : ""}
    </div>
    <div class="status" id="status"></div>`;
}

function render() {
  const searching = state.query.trim().length >= 2;
  document.querySelectorAll(".bar .tab").forEach(b => {
    if (!searching && b.dataset.view === state.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  typesetClear();
  const banner = previewName ? `<div class="banner"><p>Previewing <strong>${esc(previewName)}</strong>. This isn't published. Reload the page to see the published programme.</p></div>` : "";
  main.innerHTML = banner + (searching ? renderSearch()
    : state.view === "day" ? renderDay()
    : state.view === "mine" ? renderMine()
    : state.view === "check" ? renderCheck()
    : renderSession());
  updateCount();
  typeset();
}

/* ---------- MathJax ---------- */
function typesetClear() { try { window.MathJax?.typesetClear?.([main]); } catch { } }
function typeset() {
  const MJ = window.MathJax;
  if (!MJ || !MJ.startup || !MJ.startup.promise) return;
  MJ.startup.promise = MJ.startup.promise.then(() => MJ.typesetPromise([main])).catch(() => { });
}

/* ---------- address bar (#session=…, #day=…, #mine, #check) ---------- */
function readHash() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch { }
  if (h.startsWith("session=")) { state.view = "session"; state.session = h.slice(8); }
  else if (h.startsWith("day=")) { state.view = "day"; state.day = h.slice(4); }
  else if (h === "mine" || h === "day" || h === "check") state.view = h;
  else if (h === "" || h === "session") { state.view = "session"; state.session = ""; }
}
function setHash(h) { if ("#" + h !== location.hash) history.pushState(null, "", "#" + h); }
function defaultDay() {
  const t = new Date(), today = isoOf(t.getFullYear(), t.getMonth() + 1, t.getDate());
  if (DATES.includes(today)) return today;
  return TALKS.find(x => x.scheduled)?.date || DATES[0];
}

/* ---------- calendar file ---------- */
function icsEscape(s) { return String(s ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function icsFold(line) {
  const enc = new TextEncoder(); let out = "", cur = "", bytes = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > 74) { out += cur + "\r\n "; cur = ""; bytes = 1; } cur += ch; bytes += b; }
  return out + cur;
}
function utcStamp(date, minutes) {
  const { y, m, d } = dateParts(date);
  const mm = CONFIG.utcOffset.match(/^([+-])(\d{2}):?(\d{2})$/);
  const off = mm ? (mm[1] === "-" ? -1 : 1) * (+mm[2] * 60 + +mm[3]) : 0;
  return new Date(Date.UTC(y, m - 1, d, 0, minutes - off)).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
}
function buildICS(talks) {
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//" + CONFIG.uidDomain + "//Programme//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:" + icsEscape(CONFIG.calendarName)];
  for (const t of talks) {
    const desc = [t.session, t.coauthors ? "Authors: " + t.authors : t.speaker, htmlToText(t.abstractHtml)].filter(Boolean).join("\n\n");
    lines.push("BEGIN:VEVENT", "UID:" + t.id + "@" + CONFIG.uidDomain, "DTSTAMP:" + now,
      "DTSTART:" + utcStamp(t.date, t.start), "DTEND:" + utcStamp(t.date, t.end),
      "SUMMARY:" + icsEscape(t.speaker ? `${t.speaker}: ${t.titleText}` : t.titleText),
      "LOCATION:" + icsEscape(t.room), "DESCRIPTION:" + icsEscape(desc), "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n") + "\r\n";
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function shareUrl() { return location.origin + location.pathname + "?my=" + pickedTalks().map(t => encodeURIComponent(t.id)).join(",") + "#mine"; }
function setStatus(msg) { const s = $("#status"); if (s) s.textContent = msg; }

/* ---------- events ---------- */
main.addEventListener("change", async e => {
  const box = e.target.closest('input[type="checkbox"][data-id]');
  if (box) {
    const id = box.dataset.id;
    if (box.checked) picks.add(id); else picks.delete(id);
    savePicks(); updateCount();
    const t = BY_ID.get(id);
    document.querySelectorAll(`tr[data-id="${CSS.escape(id)}"]`).forEach(tr => {
      tr.classList.toggle("is-picked", box.checked);
      if (state.view === "mine" && !state.query.trim()) tr.classList.toggle("is-removed", !box.checked);
      const sr = tr.querySelector(".sr"); if (sr && t) sr.textContent = `${box.checked ? "Remove" : "Add"} “${t.titleText || t.speaker}” ${box.checked ? "from" : "to"} my programme`;
    });
    return;
  }
  if (e.target.id === "session-select") { state.session = e.target.value; setHash(state.session ? "session=" + encodeURIComponent(state.session) : "session"); render(); return; }
  if (e.target.id === "check-file" && e.target.files[0]) {
    const file = e.target.files[0];
    try { CHECK = analyse(parseData(await file.text()), file.name); render(); }
    catch (err) { render(); setStatus(`${file.name}: ${err.message}`); }
  }
});

let clearArmed = null;
main.addEventListener("click", e => {
  const chip = e.target.closest("[data-session]");
  if (chip) { state.session = chip.dataset.session; setHash("session=" + encodeURIComponent(state.session)); render(); window.scrollTo({ top: 0 }); return; }
  const day = e.target.closest("[data-day]");
  if (day) { state.day = day.dataset.day; setHash("day=" + state.day); render(); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { e.preventDefault(); showView(go.dataset.goto); return; }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "ics") {
    const sched = pickedTalks().filter(t => t.scheduled), later = pickedTalks().length - sched.length;
    download(CONFIG.calendarFileName, buildICS(sched), "text/calendar;charset=utf-8");
    setStatus(`Calendar file downloaded with ${plural(sched.length, "talk")}. Open it to add them to your calendar.${later ? ` ${plural(later, "talk")} without a time ${later === 1 ? "isn't" : "aren't"} included yet.` : ""}`);
  }
  if (act === "print") window.print();
  if (act === "share") {
    const url = shareUrl(), box = $("#share-out"), input = $("#share-url");
    box.hidden = false; input.value = url;
    const done = () => setStatus("Link copied. Open it on another device to see this programme there.");
    const fallback = () => { input.focus(); input.select(); setStatus("Copy the link above to open this programme on another device."); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
  }
  if (act === "clear") {
    const btn = e.target.closest("[data-act]");
    if (clearArmed) { clearTimeout(clearArmed); clearArmed = null; picks.clear(); savePicks(); render(); return; }
    btn.textContent = "Click again to clear everything";
    clearArmed = setTimeout(() => { clearArmed = null; btn.textContent = "Clear all"; }, 4000);
  }
  if (act === "incoming-add") { incoming.forEach(id => picks.add(id)); incoming = null; savePicks(); render(); }
  if (act === "incoming-replace") { picks = new Set(incoming); incoming = null; savePicks(); render(); }
  if (act === "incoming-ignore") { incoming = null; render(); }
  if (act === "tidy") {
    const a = CHECK || PUBLISHED;
    download("programme.json", publicCopy(a), "application/json");
    setStatus(`programme.json downloaded with ${plural(a.talks.length, "talk")}. Upload it to the website folder, replacing the old one.`);
  }
  if (act === "preview" && CHECK) { previewName = CHECK.name; applyData(CHECK); showView("session"); }
});

function showView(view) {
  state.view = view; state.query = ""; $("#search").value = "";
  if (view === "session") setHash(state.session ? "session=" + encodeURIComponent(state.session) : "session");
  else if (view === "day") setHash("day=" + (DATES.includes(state.day) ? state.day : defaultDay()));
  else setHash(view);
  render();
}
document.querySelectorAll(".bar .tab").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
$("#search").addEventListener("input", e => {
  const was = state.query.trim().length >= 2;
  state.query = e.target.value;
  if (was || state.query.trim().length >= 2) render();
});
window.addEventListener("popstate", () => { readHash(); render(); });
window.addEventListener("hashchange", () => { readHash(); render(); });
window.addEventListener("storage", e => { if (e.key === CONFIG.storageKey) { picks = loadPicks(); render(); } });

/* ---------- start ---------- */
async function start() {
  $("#conf-title").textContent = CONFIG.title;
  $("#conf-sub").textContent = CONFIG.subtitle;
  if (CONFIG.notice) { $("#notice").textContent = CONFIG.notice; $("#notice").hidden = false; }
  if (CONFIG.siteUrl) $("#site-link").innerHTML = `Conference website: <a href="${esc(CONFIG.siteUrl)}">${esc(CONFIG.siteUrl.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>`;
  picks = loadPicks();

  let records;
  try {
    const res = await fetch(CONFIG.dataUrl, { cache: "no-cache" });
    if (!res.ok) throw new Error(`couldn't find ${CONFIG.dataUrl} (HTTP ${res.status})`);
    records = parseData(await res.text());
  } catch (err) {
    const local = location.protocol === "file:";
    main.innerHTML = `<div class="error"><strong>The programme couldn't be loaded.</strong><br>
      ${local ? "This page was opened straight from a file on your computer, and browsers block it from reading the programme file that way. Upload it to GitHub Pages, or start a small local web server (see the README)."
              : esc(err.message)}</div>`;
    return;
  }
  PUBLISHED = analyse(records, CONFIG.dataUrl);
  applyData(PUBLISHED);
  const probs = findProblems(PUBLISHED).filter(p => !p.info);
  if (probs.length) console.warn(`Programme data: ${plural(probs.length, "problem")}. Open #check for details.`);

  const params = new URLSearchParams(location.search);
  if (params.has("my")) {
    const ids = params.get("my").split(",").map(s => s.trim()).filter(id => BY_ID.has(id));
    history.replaceState(null, "", location.pathname + "#mine");
    if (ids.length) {
      if (!picks.size) { ids.forEach(id => picks.add(id)); savePicks(); }
      else if (!ids.every(id => picks.has(id))) incoming = ids;
    }
  }
  readHash();
  render();
}
start();
</script>
</body>
</html>
